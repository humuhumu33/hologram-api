name: index

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Top N models by downloads"
        default: "1000"
      trending:
        description: "Also index the top N trending models"
        default: "500"

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --quiet blake3

      - name: Selftest — canonical form must match hologram-api
        run: python indexer/index.py --selftest

      - name: Index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python indexer/index.py --limit "${{ github.event.inputs.limit || '1000' }}" --trending "${{ github.event.inputs.trending || '500' }}" --budget-minutes 320

      - name: Verify every new manifest is named by its own BLAKE3
        run: |
          python - <<'PY'
          import blake3, glob, os, sys
          bad = [p for p in glob.glob("v1/manifests/*.json")
                 if blake3.blake3(open(p, "rb").read()).hexdigest() != os.path.basename(p)[:-5]]
          sys.exit(f"misnamed manifests: {bad}" if bad else print("all manifests self-verify"))
          PY

      - name: Commit
        run: |
          git config user.name "hologram-index"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "index: $(date -u +%Y-%m-%dT%H:%MZ) — $(python -c 'import json;print(len(json.load(open("v1/index.json"))["models"]))') models"
          git push
